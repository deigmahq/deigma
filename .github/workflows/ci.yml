# Generated by scripts/publish-client in the private monorepo: do not edit here, the next sync
# overwrites it. The action pins are the monorepo's own, and so are the Node version
# (.node-version) and the pnpm version ("packageManager" in package.json).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    name: client (typecheck, tests, builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Tests
        run: pnpm test

      - name: Build the CLI and ask the bundle for help
        run: |
          pnpm --filter deigma run build
          node apps/wedge-cli/dist/deigma.js --help

      - name: Build the extension
        run: pnpm --filter passport run build

      # The list at deigma.net/audit is generated from these schemas; a stale copy fails here.
      - name: The audit list is what the schemas generate
        run: |
          pnpm --filter @mentat/schemas run generate
          pnpm --filter @mentat/schemas run gen-traffic-audit
          git diff --exit-code -- packages/schemas/json packages/schemas/traffic-audit.json
